<script>
(function(){
  var D={paginas:[]}; try{D=JSON.parse(document.getElementById('paginas-legais').textContent)}catch(e){}
  var P=D.paginas||[], tabs=document.getElementById('tabs'), doc=document.getElementById('doc');
  if(!P.length) return;
  tabs.innerHTML=P.map(function(p){return '<a class="tab" role="tab" id="tab-'+p.slug+'" href="#'+p.slug+'" data-tab="'+p.slug+'" aria-controls="doc">'+p.titulo+'</a>'}).join('');
  var links=[].slice.call(tabs.querySelectorAll('.tab'));
  function find(slug){for(var i=0;i<P.length;i++) if(P[i].slug===slug) return P[i]; return null}
  function render(slug,focus){
    var p=find(slug)||P[0];
    links.forEach(function(a){var on=a.dataset.tab===p.slug; a.setAttribute('aria-selected',on?'true':'false'); a.tabIndex=on?0:-1;});
    doc.setAttribute('aria-labelledby','tab-'+p.slug);
    doc.innerHTML='<h1>'+p.titulo+'</h1>'+(p.atualizado?'<p class="upd">Última atualização: '+p.atualizado+'</p>':'')+(p.intro?'<p class="intro">'+p.intro+'</p>':'')+
      (p.secoes||[]).map(function(s){return '<h2>'+s.titulo+'</h2>'+s.html}).join('');
    document.title=p.titulo+' · ALPHA PRO';
    if(focus){ doc.focus({preventScroll:true}); if(innerWidth<1024) tabs.scrollIntoView({block:'start'}); else scrollTo(0,0); }
    var cur=tabs.querySelector('[aria-selected="true"]'); if(cur&&cur.scrollIntoView&&innerWidth<1024) cur.scrollIntoView({inline:'center',block:'nearest'});
  }
  function slugNow(){return decodeURIComponent(location.hash.replace('#',''))}
  /* trocar de aba troca a URL (cada política tem o seu link) */
  document.addEventListener('click',function(e){
    var a=e.target.closest('[data-tab]'); if(!a) return;
    e.preventDefault(); var s=a.dataset.tab; if(s===slugNow()) return;
    history.pushState(null,'','#'+s); render(s,true);
  });
  addEventListener('popstate',function(){render(slugNow(),false)});
  addEventListener('hashchange',function(){render(slugNow(),false)});
  tabs.addEventListener('keydown',function(e){
    var i=links.indexOf(document.activeElement); if(i<0) return;
    var n=e.key==='ArrowDown'||e.key==='ArrowRight'?i+1:e.key==='ArrowUp'||e.key==='ArrowLeft'?i-1:null; if(n===null) return;
    e.preventDefault(); n=(n+links.length)%links.length; links[n].focus(); links[n].click();
  });
  if(!find(slugNow())) history.replaceState(null,'','#'+P[0].slug);
  render(slugNow(),false);
})();
</script>
